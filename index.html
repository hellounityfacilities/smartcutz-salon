<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Cutz — Salon Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Rubik:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#F6F2EA;--panel:#fff;--ink:#17130D;--ink2:#6B6252;--line:#E3DCCB;--gold:#B8860B;--gold2:#8F6707;--green:#2E7D4F;--red:#B23A2F;--blue:#2C5F9E;--side:#17130D}
*{box-sizing:border-box}
body{margin:0;font-family:'Rubik',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
body[dir=rtl]{font-family:'Noto Kufi Arabic','Rubik',sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700}
body[dir=rtl] h1,body[dir=rtl] h2,body[dir=rtl] h3{font-family:'Noto Kufi Arabic',sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold)}
.logo i{width:30px;height:30px;border:2px solid var(--gold);border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-family:'Rubik';font-weight:700}
.navbtn{background:none;border:0;color:#fff;opacity:.75;text-align:start;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.navbtn:hover{opacity:1;background:#ffffff14}
.navbtn.active{opacity:1;background:var(--gold);color:#17130D;font-weight:500}
.navbtn .badge{background:#00000033;border-radius:999px;padding:1px 8px;font-size:12px}
aside .spacer{flex:1}
.langbtn{border:1px solid #ffffff55;background:none;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
main{padding:22px 28px;display:grid;gap:18px;align-content:start}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:34px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer;background:#EDE6D6;color:var(--ink)}
.btn.primary{background:var(--gold);color:#17130D}
.btn.dark{background:var(--ink);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;border-inline-start:5px solid var(--gold)}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:36px;line-height:1;font-weight:700}
.kpi .l{color:var(--ink2);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:24px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--ink2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
body[dir=rtl] th{letter-spacing:0}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:#EDE6D6}
.tag.booked{background:#E3ECF7;color:var(--blue)}.tag.waiting{background:#FBEFD2;color:#7A5300}.tag.inchair,.tag.serving{background:#DCEFE2;color:var(--green)}.tag.done,.tag.paid,.tag.active{background:#DCEFE2;color:var(--green)}.tag.noshow,.tag.cancelled,.tag.lapsed{background:#F9DCDA;color:var(--red)}.tag.member{background:#F3E4BF;color:var(--gold2)}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--ink2)}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(900px,100%);max-height:92vh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-inline-start:auto}
.muted{color:var(--ink2);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* booking grid */
.sched{display:grid;grid-template-columns:70px repeat(var(--n),1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.sched .hd{background:#EDE6D6;padding:8px;font-weight:500;text-align:center;border-bottom:1px solid var(--line)}
.sched .tm{padding:4px 6px;color:var(--ink2);border-top:1px solid var(--line);font-size:12px;height:34px}
.sched .slot{border-top:1px solid var(--line);border-inline-start:1px solid var(--line);height:34px;cursor:pointer;position:relative}
.sched .slot:hover{background:#FBF6E8}
.sched .slot.half{border-top-style:dashed}
.bk{position:absolute;inset:2px;border-radius:6px;padding:3px 6px;font-size:12px;line-height:1.2;overflow:hidden;background:#E3ECF7;color:var(--blue);border-inline-start:3px solid var(--blue);z-index:2}
.bk.serving{background:#DCEFE2;color:var(--green);border-color:var(--green)}.bk.done{background:#eee;color:#666;border-color:#999}.bk.noshow{background:#F9DCDA;color:var(--red);border-color:var(--red)}
/* queue */
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.qcard b{font-size:17px}
.qn{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--gold);line-height:1}
/* POS */
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.svcgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.svc{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:grid;gap:4px}
.svc:hover{border-color:var(--gold)}
.svc .p{font-weight:700;color:var(--gold2)}
.svc.line{border-inline-start:4px solid var(--gold)}
.cart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.cart .tot{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;text-align:end}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.bar{height:8px;background:#EDE6D6;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.logo{width:100%}.two,.pos{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.topbar,.noprint{display:none!important}.app{display:block}}
</style>
</head>
<body>

  <div class="logo"><i>SC</i><span data-t="brand">Smart Cutz</span></div>

  <p class="muted" style="color:#ffffff88;font-size:12px;margin:10px 4px 0" data-t="demo">Demo build — data saved in this browser</p>
</aside>
<main id="main"></main>
</div>
<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

 modal(`<h2>${t('receipt')} · ${sale.id}</h2><div class="muted">${S.settings.name} · ${S.settings.cr} · ${sale.date} ${sale.time} · ${barber(sale.barber).name}</div><table>${sale.items.map(i=>`<tr><td>${i.name} ×${i.qty}</td><td style="text-align:end">${fmt(i.price*i.qty)}</td></tr>`).join('')}${sale.disc?`<tr><td>${t('discount')}</td><td style="text-align:end">−${fmt(sale.disc)}</td></tr>`:''}<tr><td><b>${t('total')}</b> (${t(sale.method)})</td><td style="text-align:end"><b>${fmt(sale.total)}</b></td></tr></table><p class="muted">${t('thanks')}</p>
 <div class="row"><button class="btn ghost" onclick="window.print()">${t('receipt')} PDF</button>${c&&c.phone?`<a class="btn" target="_blank" href="${waLink(c,`${S.settings.name}: ${t('thanks')} ${t('receipt')} ${sale.id} — ${fmt(sale.total)}. Book your next visit: reply here.`)}">WhatsApp</a>`:''}<button class="btn primary right" onclick="closeModal();go('dashboard')">${t('done')}</button></div>`);toast(fmt(sale.total)+' ✓')}

// ---------------------------------------------------------------- reports
VIEWS.reports=()=>{const T=today(),m=T.slice(0,7);const ms=S.sales.filter(s=>s.date.slice(0,7)===m);const rev=ms.reduce((a,s)=>a+s.total,0);
 const retail=ms.reduce((a,s)=>a+s.items.filter(i=>i.type==='prod').reduce((x,i)=>x+i.price*i.qty,0),0);
 const days=[...Array(7)].map((_,i)=>addDays(T,-6+i)).map(d=>({d,v:S.sales.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0)}));const mx=Math.max(1,...days.map(x=>x.v));
 const mix={};ms.forEach(s=>s.items.filter(i=>i.type==='svc').forEach(i=>{const l=svc(i.id).line||'Smart';mix[l]=(mix[l]||0)+i.price*i.qty}));
 const active=S.clients.filter(c=>clientStatus(c.id)==='Active').length,lapsed=S.clients.filter(c=>clientStatus(c.id)==='Lapsed').length;
 const byB=S.barbers.map(b=>({b,v:ms.filter(s=>s.barber===b.id).reduce((a,s)=>a+s.total,0)}));
 return `<div class="topbar"><h1>${t('reports')}</h1><span class="muted">${m}</span></div>
 <div class="kpis"><div class="kpi"><div class="v">${fmt(rev)}</div><div class="l">${t('total')} · ${m}</div></div><div class="kpi"><div class="v">${fmt(ms.length?rev/ms.length:0)}</div><div class="l">${t('avgTicket')}</div></div><div class="kpi" style="border-color:var(--green)"><div class="v">${rev?Math.round(retail/rev*100):0}%</div><div class="l">${t('retailShare')} · ${fmt(retail)}</div></div><div class="kpi" style="border-color:var(--blue)"><div class="v">${active+lapsed?Math.round(active/(active+lapsed)*100):0}%</div><div class="l">${t('retention')} · ${active} ${ts('Active')} / ${lapsed} ${ts('Lapsed')}</div></div></div>
 <div class="two"><div class="panel"><h2>${t('daily')}</h2><table>${days.map(x=>`<tr><td style="width:110px">${x.d.slice(5)}</td><td><div class="bar"><i style="width:${x.v/mx*100}%"></i></div></td><td style="width:110px;text-align:end"><b>${fmt(x.v)}</b></td></tr>`).join('')}</table></div>
 <div class="panel"><h2>${t('takingsBy')}</h2><table>${byB.map(x=>`<tr><td style="width:110px">${x.b.name}</td><td><div class="bar"><i style="width:${rev?x.v/rev*100:0}%"></i></div></td><td style="width:110px;text-align:end"><b>${fmt(x.v)}</b></td></tr>`).join('')}</table>
 <h2 style="margin-top:16px">${t('serviceMix')}</h2><table>${Object.entries(mix).map(([l,v])=>`<tr><td style="width:110px">${tl(l)}</td><td><div class="bar"><i style="width:${v/Math.max(1,...Object.values(mix))*100}%"></i></div></td><td style="width:110px;text-align:end"><b>${fmt(v)}</b></td></tr>`).join('')}</table></div></div>`};


// ---------------------------------------------------------------- accounting engine
const acct=c=>S.accounts.find(a=>a.code===c)||{code:c,name:'?',type:'asset'};
const payAcct=m=>m==='cash'?'1000':'1010';
const billPaid=b=>b.payments.reduce((a,p)=>a+ +p.amount,0);const billTotal=b=>b.lines.reduce((a,l)=>a+ +l.amount,0)+(+b.vat||0);const billBal=b=>billTotal(b)-billPaid(b);
const supplier=id=>S.suppliers.find(x=>x.id===id)||{name:'?'};
const prodCost=id=>(S.products.find(p=>p.id===id)||{}).cost||0;
function allJournals(){const J=[];J.push({id:'OPEN',date:S.opening.date,ref:'Opening',memo:'Opening balances',lines:S.opening.lines});
 S.sales.forEach(sl=>{let svcRev=0,retail=0,memSale=0,memRec=0,cogs=0;sl.items.forEach(i=>{const v=i.price*i.qty;if(i.type==='member')memSale+=v;else if(i.type==='prod'){retail+=v;cogs+=prodCost(i.id)*i.qty}else{svcRev+=v;if(i.free){const c=sl.client?S.clients.find(x=>x.id===sl.client):null;const pl=c&&c.member?S.plans.find(x=>x.id===c.member.plan):null;memRec+=i.memValue||(pl?pl.price/pl.visits:0)}}});
  svcRev=Math.max(0,svcRev-(+sl.disc||0));const cash=sl.total;const lines=[];if(cash)lines.push({acct:payAcct(sl.method),dr:cash,cr:0});if(svcRev)lines.push({acct:'4000',dr:0,cr:svcRev});if(retail)lines.push({acct:'4010',dr:0,cr:retail});if(memSale)lines.push({acct:'2200',dr:0,cr:memSale});
  if(memRec){lines.push({acct:'2200',dr:memRec,cr:0});lines.push({acct:'4020',dr:0,cr:memRec})}if(cogs){lines.push({acct:'5000',dr:cogs,cr:0});lines.push({acct:'1200',dr:0,cr:cogs})}
  const c=sl.client?client(sl.client).name:(sl.walkName||'Walk-in');J.push({id:sl.id,date:sl.date,ref:sl.id,memo:`Sale — ${c} · ${barber(sl.barber).name}`,lines,src:'sale'})});
 S.bills.forEach(b=>{const lines=b.lines.map(l=>({acct:l.acct,dr:+l.amount,cr:0}));if(+b.vat)lines.push({acct:'2100',dr:+b.vat,cr:0});lines.push({acct:'2000',dr:0,cr:billTotal(b)});J.push({id:b.id,date:b.date,ref:b.id,memo:`Bill — ${supplier(b.supplier).name}`,lines,src:'bill'});
  b.payments.forEach((p,k)=>J.push({id:b.id+'-'+k,date:p.date,ref:b.id,memo:`Paid ${supplier(b.supplier).name}`,lines:[{acct:'2000',dr:+p.amount,cr:0},{acct:payAcct(p.method==='cash'?'cash':'card'),dr:0,cr:+p.amount}],src:'billpay'}))});
 S.expenses.forEach(e=>J.push({id:e.id,date:e.date,ref:e.id,memo:e.desc,lines:[{acct:e.acct,dr:+e.amount,cr:0},{acct:e.from,dr:0,cr:+e.amount}],src:'expense'}));
 S.manualJournals.forEach(j=>J.push({...j,src:'manual'}));return J.sort((a,b)=>a.date<b.date?-1:1)}
function balances(from,to){const bal={};allJournals().forEach(j=>{if((from&&j.date<from)||(to&&j.date>to))return;j.lines.forEach(l=>{bal[l.acct]=(bal[l.acct]||0)+(+l.dr||0)-(+l.cr||0)})});return bal}
const natural=(a,v)=>['asset','expense'].includes(a.type)?v:-v;
function periodRange(p){const T=today(),m=T.slice(0,7);if(p==='month')return [m+'-01',T];if(p==='last'){const d=new Date(T);d.setMonth(d.getMonth()-1);const lm=d.toISOString().slice(0,7);return [lm+'-01',lm+'-31']}if(p==='ytd')return [T.slice(0,4)+'-01-01',T];return [null,T]}
let acctTab='reports2',acctPeriod='month';
function commissionsAccrued(from,to){return S.barbers.reduce((a,b)=>a+S.sales.filter(x=>x.barber===b.id&&(!from||x.date>=from)&&x.date<=to).reduce((y,x)=>y+x.items.filter(i=>i.type==='svc').reduce((z,i)=>z+i.price*i.qty,0),0)*b.comm/100,0)}

 ${S.expenses.slice().sort((a,b)=>a.date<b.date?1:-1).map(e=>`<tr><td><b>${e.id}</b></td><td class="muted">${e.date}</td><td>${e.desc}</td><td>${acct(e.acct).name}</td><td>${acct(e.from).name}</td><td><b>${fmt(e.amount)}</b></td><td><button class="btn sm ghost" onclick="S.expenses=S.expenses.filter(x=>x.id!=='${e.id}');persist();render()">×</button></td></tr>`).join('')}</table></div>`};
function acctOptions(types,sel){return S.accounts.filter(a=>types.includes(a.type)).map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${a.code} · ${a.name}</option>`).join('')}
function openBill(){modal(`<h2>${t('newBill')}</h2><div class="grid2"><label>${t('supplierN')}<select id="b_s">${S.suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}<option value="__new">+ New supplier…</option></select></label><label>${t('name')} (new supplier)<input id="b_sn"></label><label>${t('ref')}<input id="b_r"></label><label>${t('date')}<input type="date" id="b_d" value="${today()}"></label><label>${t('dueDate')}<input type="date" id="b_due" value="${addDays(today(),30)}"></label><label>${t('account')}<select id="b_a">${acctOptions(['expense','asset'],'6040')}</select></label><label>${t('memo')}<input id="b_m"></label><label>${t('amount')}<input type="number" id="b_amt" value="0"></label></div>
 <div class="row"><button class="btn primary" onclick="saveBill()">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
function saveBill(){const v=k=>document.getElementById(k).value;let sp=v('b_s');if(sp==='__new'){const n=v('b_sn').trim();if(!n)return toast('Supplier name required');sp='sp'+uid();S.suppliers.push({id:sp,name:n,phone:''})}if(!+v('b_amt'))return;
 S.bills.push({id:'BILL-'+(S.seq.bill++),date:v('b_d'),due:v('b_due'),supplier:sp,ref:v('b_r'),lines:[{acct:v('b_a'),desc:v('b_m'),amount:+v('b_amt')}],vat:0,payments:[]});persist();closeModal();render();toast('✓')}
function openPayBill(id){const b=S.bills.find(x=>x.id===id);modal(`<h2>${t('payBill')} · ${id}</h2><p>${supplier(b.supplier).name} · ${t('outstanding')}: <b>${fmt(billBal(b))}</b></p><div class="grid2"><label>${t('amount')}<input type="number" id="pb_a" value="${Math.round(billBal(b))}"></label><label>${t('paidFrom')}<select id="pb_m"><option value="transfer">${t('bankAcct')}</option><option value="cash">${t('cashAcct')}</option></select></label><label>${t('date')}<input type="date" id="pb_d" value="${today()}"></label></div>
 <div class="row"><button class="btn green" onclick="S.bills.find(x=>x.id==='${id}').payments.push({date:document.getElementById('pb_d').value,amount:+document.getElementById('pb_a').value,method:document.getElementById('pb_m').value});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
function openExpense(){modal(`<h2>${t('newExpense')}</h2><div class="grid2"><label>${t('date')}<input type="date" id="e_d" value="${today()}"></label><label>${t('expenseAcct')}<select id="e_a">${acctOptions(['expense'],'6090')}</select></label><label>${t('memo')}<input id="e_m"></label><label>${t('amount')}<input type="number" id="e_amt" value="0"></label><label>${t('paidFrom')}<select id="e_f"><option value="1000">${t('cashAcct')}</option><option value="1010">${t('bankAcct')}</option></select></label></div>
 <div class="row"><button class="btn primary" onclick="const v=k=>document.getElementById(k).value;if(!+v('e_amt'))return;S.expenses.push({id:'EXP-'+(S.seq.exp++),date:v('e_d'),acct:v('e_a'),desc:v('e_m'),amount:+v('e_amt'),from:v('e_f')});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}

// ---------------------------------------------------------------- accounting views
VIEWS.accounts=()=>{const tabs=['reports2','ageing','journal','chart'];return `<div class="topbar"><h1>${t('accounts')}</h1><div class="row">${tabs.map(x=>`<button class="btn sm ${acctTab===x?'primary':''}" onclick="acctTab='${x}';render()">${t(x)}</button>`).join('')}</div></div>${ACCT[acctTab]()}`};
const ACCT={};
function periodSel(){return `<select style="width:auto" onchange="acctPeriod=this.value;render()">${[['month','thisMonth'],['last','lastMonth'],['ytd','ytd'],['all','allTime']].map(([v,k])=>`<option value="${v}" ${acctPeriod===v?'selected':''}>${t(k)}</option>`).join('')}</select>`}
ACCT.reports2=()=>{const [from,to]=periodRange(acctPeriod);const pb=balances(from,to);const cb=balances(null,to);const sum=(type,b)=>S.accounts.filter(a=>a.type===type).reduce((x,a)=>x+natural(a,b[a.code]||0),0);
 const comm=commissionsAccrued(from,to);const inc=sum('income',pb),exp=sum('expense',pb)+comm,np=inc-exp;const incAll=sum('income',cb),expAll=sum('expense',cb)+commissionsAccrued(to.slice(0,7)+'-01',to);
 const rows=(type,b)=>S.accounts.filter(a=>a.type===type&&(b[a.code]||0)!==0).map(a=>`<tr><td>${a.code} · ${a.name}</td><td style="text-align:end">${fmt(natural(a,b[a.code]||0))}</td></tr>`).join('');
 const assets=sum('asset',cb),liab=sum('liability',cb)+commissionsAccrued(to.slice(0,7)+'-01',to),eq=sum('equity',cb)+(incAll-expAll);
 const tbRows=S.accounts.filter(a=>(cb[a.code]||0)!==0).map(a=>{const v=cb[a.code]||0;return `<tr><td>${a.code}</td><td>${a.name}</td><td class="muted">${I18N[lang].atype[a.type]}</td><td style="text-align:end">${v>0?fmt(v):''}</td><td style="text-align:end">${v<0?fmt(-v):''}</td></tr>`}).join('');
 const tdr=Object.values(cb).filter(v=>v>0).reduce((a,v)=>a+v,0),tcr=-Object.values(cb).filter(v=>v<0).reduce((a,v)=>a+v,0);
 return `<div class="row"><span class="muted">${t('period')}:</span>${periodSel()}<span class="muted">${from||'—'} → ${to}</span></div>
 <div class="kpis"><div class="kpi" style="border-color:var(--green)"><div class="v">${fmt(inc)}</div><div class="l">${t('income')}</div></div><div class="kpi" style="border-color:var(--red)"><div class="v">${fmt(exp)}</div><div class="l">${t('expenses')}</div></div><div class="kpi" style="border-color:${np>=0?'var(--green)':'var(--red)'}"><div class="v">${fmt(np)}</div><div class="l">${t('netProfit')} · ${inc?Math.round(np/inc*100):0}%</div></div><div class="kpi"><div class="v">${fmt((cb['1000']||0)+(cb['1010']||0))}</div><div class="l">${t('cashbank')}</div></div><div class="kpi" style="border-color:var(--blue)"><div class="v">${fmt(-(cb['2200']||0))}</div><div class="l">${t('deferred')}</div></div><div class="kpi" style="border-color:var(--red)"><div class="v">${fmt(-(cb['2000']||0))}</div><div class="l">${t('ap')}</div></div></div>
 <div class="two"><div class="panel"><h2>${t('pnl')}</h2><table><tr><th colspan=2>${t('income')}</th></tr>${rows('income',pb)}<tr><td><b>${t('income')}</b></td><td style="text-align:end"><b>${fmt(inc)}</b></td></tr><tr><th colspan=2>${t('expenses')}</th></tr>${rows('expense',pb)}<tr><td>6010 · Barber commissions (accrued)</td><td style="text-align:end">${fmt(comm)}</td></tr><tr><td><b>${t('expenses')}</b></td><td style="text-align:end"><b>${fmt(exp)}</b></td></tr><tr style="background:${np>=0?'#DCEFE2':'#F9DCDA'}"><td><b>${t('netProfit')}</b></td><td style="text-align:end"><b>${fmt(np)}</b></td></tr></table><p class="muted">Commissions are accrued from service sales × each barber's commission %, and shown as payable until salaries are paid.</p></div>
 <div class="panel"><h2>${t('bs')} · ${to}</h2><table><tr><th colspan=2>${t('assets')}</th></tr>${rows('asset',cb)}<tr><td><b>${t('assets')}</b></td><td style="text-align:end"><b>${fmt(assets)}</b></td></tr><tr><th colspan=2>${t('liabilities')}</th></tr>${rows('liability',cb)}<tr><td>2300 · Commissions payable (accrued)</td><td style="text-align:end">${fmt(commissionsAccrued(to.slice(0,7)+'-01',to))}</td></tr><tr><td><b>${t('liabilities')}</b></td><td style="text-align:end"><b>${fmt(liab)}</b></td></tr><tr><th colspan=2>${t('equity')}</th></tr>${rows('equity',cb)}<tr><td>${t('netProfit')} (${t('allTime').toLowerCase()})</td><td style="text-align:end">${fmt(incAll-expAll)}</td></tr><tr><td><b>${t('equity')}</b></td><td style="text-align:end"><b>${fmt(eq)}</b></td></tr><tr style="background:#EDE6D6"><td><b>${t('liabilities')} + ${t('equity')}</b></td><td style="text-align:end"><b>${fmt(liab+eq)}</b></td></tr></table></div></div>
 <div class="panel"><h2>${t('tb')} · ${to}</h2><table><tr><th>${t('code')}</th><th>${t('account')}</th><th>${t('typeA')}</th><th style="text-align:end">${t('debit')}</th><th style="text-align:end">${t('credit')}</th></tr>${tbRows}<tr style="background:#EDE6D6"><td colspan=3><b>${t('total')}</b></td><td style="text-align:end"><b>${fmt(tdr)}</b></td><td style="text-align:end"><b>${fmt(tcr)}</b></td></tr></table></div>`};
ACCT.ageing=()=>{const T=today();const rows=S.suppliers.map(sp=>{const bs=S.bills.filter(b=>b.supplier===sp.id&&billBal(b)>0.5);if(!bs.length)return null;const b={cur:0,d30:0,d60:0,d90:0,d90p:0};bs.forEach(x=>{const d=Math.round((new Date(T)-new Date(x.due))/86400000);const v=billBal(x);if(d<=0)b.cur+=v;else if(d<=30)b.d30+=v;else if(d<=60)b.d60+=v;else if(d<=90)b.d90+=v;else b.d90p+=v});return {n:sp.name,b,tot:Object.values(b).reduce((a,v)=>a+v,0)}}).filter(Boolean);
 return `<div class="panel"><h2>${t('ap')}</h2><table><tr><th>${t('name')}</th><th style="text-align:end">${t('current')}</th><th style="text-align:end">${t('d30')}</th><th style="text-align:end">${t('d60')}</th><th style="text-align:end">${t('d90')}</th><th style="text-align:end">${t('d90p')}</th><th style="text-align:end">${t('outstanding')}</th></tr>${rows.map(r=>`<tr><td><b>${r.n}</b></td>${['cur','d30','d60','d90','d90p'].map(k=>`<td style="text-align:end;${k!=='cur'&&r.b[k]?'color:var(--red)':''}">${r.b[k]?fmt(r.b[k]):''}</td>`).join('')}<td style="text-align:end"><b>${fmt(r.tot)}</b></td></tr>`).join('')||`<tr><td colspan=7 class="muted">${t('noData')}</td></tr>`}</table></div>`};
ACCT.journal=()=>{const J=allJournals().slice().reverse();return `<div class="row"><button class="btn primary" onclick="openJE()">+ ${t('manualJE')}</button><span class="muted">${J.length} entries · built from sales, bills and expenses; manual entries are stored.</span></div>
 <div class="panel"><table><tr><th>${t('date')}</th><th>${t('ref')}</th><th>${t('memo')}</th><th>${t('account')}</th><th style="text-align:end">${t('debit')}</th><th style="text-align:end">${t('credit')}</th></tr>${J.slice(0,150).map(j=>j.lines.map((l,k)=>`<tr>${k===0?`<td rowspan="${j.lines.length}" class="muted">${j.date}</td><td rowspan="${j.lines.length}"><b>${j.ref}</b><br><span class="tag">${j.src||'opening'}</span></td><td rowspan="${j.lines.length}">${j.memo}</td>`:''}<td style="${l.cr?'padding-inline-start:36px':''}">${l.acct} · ${acct(l.acct).name}</td><td style="text-align:end">${l.dr?fmt(l.dr):''}</td><td style="text-align:end">${l.cr?fmt(l.cr):''}</td></tr>`).join('')).join('')}</table></div>`};
let JE=null;
function openJE(){JE={date:today(),memo:'',lines:[{acct:'6090',dr:0,cr:0},{acct:'1010',dr:0,cr:0}]};renderJE()}
function renderJE(){const dr=JE.lines.reduce((a,l)=>a+ +l.dr,0),cr=JE.lines.reduce((a,l)=>a+ +l.cr,0);
 modal(`<h2>${t('manualJE')}</h2><div class="grid2"><label>${t('date')}<input type="date" value="${JE.date}" onchange="JE.date=this.value"></label><label>${t('memo')}<input value="${esc(JE.memo)}" oninput="JE.memo=this.value"></label></div>
 <table><tr><th>${t('account')}</th><th>${t('debit')}</th><th>${t('credit')}</th><th></th></tr>${JE.lines.map((l,i)=>`<tr><td><select onchange="JE.lines[${i}].acct=this.value">${acctOptions(['asset','liability','equity','income','expense'],l.acct)}</select></td><td><input type="number" value="${l.dr}" onchange="JE.lines[${i}].dr=+this.value;renderJE()"></td><td><input type="number" value="${l.cr}" onchange="JE.lines[${i}].cr=+this.value;renderJE()"></td><td><button class="btn sm ghost" onclick="JE.lines.splice(${i},1);renderJE()">×</button></td></tr>`).join('')}<tr><td><b>${t('total')}</b></td><td><b>${fmt(dr)}</b></td><td><b>${fmt(cr)}</b></td><td></td></tr></table>
 <div class="row"><button class="btn sm" onclick="JE.lines.push({acct:'6090',dr:0,cr:0});renderJE()">+ ${t('addLineJ')}</button>${Math.abs(dr-cr)>0.005?`<span class="tag lapsed">${t('balanceCheck')}</span>`:''}<button class="btn primary right" ${Math.abs(dr-cr)>0.005||!dr?'disabled':''} onclick="S.manualJournals.push({id:'JE-'+(S.seq.je++),date:JE.date,ref:'JE-'+(S.seq.je-1),memo:JE.memo,lines:JE.lines.filter(l=>l.dr||l.cr)});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
ACCT.chart=()=>{const cb=balances(null,today());return `<div class="panel"><table><tr><th>${t('code')}</th><th>${t('account')}</th><th>${t('typeA')}</th><th style="text-align:end">${t('balance')||'Balance'}</th></tr>${S.accounts.map((a,i)=>`<tr><td><b>${a.code}</b></td><td><input value="${esc(a.name)}" onchange="S.accounts[${i}].name=this.value;persist()"></td><td><span class="tag">${I18N[lang].atype[a.type]}</span></td><td style="text-align:end">${fmt(natural(a,cb[a.code]||0))}</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:12px"><input id="na_code" placeholder="6080" style="width:100px"><input id="na_name" placeholder="Account name" style="width:260px"><select id="na_type" style="width:auto">${['asset','liability','equity','income','expense'].map(x=>`<option value="${x}">${I18N[lang].atype[x]}</option>`).join('')}</select><button class="btn sm" onclick="const c=document.getElementById('na_code').value.trim();if(!c||S.accounts.find(a=>a.code===c))return toast('Code exists');S.accounts.push({code:c,name:document.getElementById('na_name').value,type:document.getElementById('na_type').value});S.accounts.sort((a,b)=>a.code<b.code?-1:1);persist();render()">+ ${t('account')}</button></div></div>`};

// ---------------------------------------------------------------- settings
VIEWS.settings=()=>`<div class="topbar"><h1>${t('settings')}</h1><button class="btn ghost" onclick="if(confirm('Reset demo data?')){S=seed();persist();render()}">Reset demo data</button></div><div class="two"><div class="panel"><div class="grid2">
 <label>${t('salonName')}<input value="${esc(S.settings.name)}" onchange="S.settings.name=this.value;persist()"></label><label>C.R.<input value="${esc(S.settings.cr)}" onchange="S.settings.cr=this.value;persist()"></label><label>${t('phone')}<input value="${esc(S.settings.phone)}" onchange="S.settings.phone=this.value;persist()"></label>
 <label>${t('open')}<input type="number" value="${S.settings.open}" onchange="S.settings.open=+this.value;persist()"></label><label>${t('close')}<input type="number" value="${S.settings.close}" onchange="S.settings.close=+this.value;persist()"></label><label>${t('slot')}<input type="number" value="${S.settings.slot}" onchange="S.settings.slot=+this.value;persist()"></label></div></div>
 <div class="panel"><h2>${t('plans')}</h2><table><tr><th>${t('planName')}</th><th>${t('price')}</th><th>${t('visits2')}</th></tr>${S.plans.map((p,i)=>`<tr><td><input value="${esc(p.name)}" onchange="S.plans[${i}].name=this.value;persist()"></td><td><input type="number" value="${p.price}" style="width:80px" onchange="S.plans[${i}].price=+this.value;persist()"></td><td><input type="number" value="${p.visits}" style="width:70px" onchange="S.plans[${i}].visits=+this.value;persist()"></td></tr>`).join('')}</table></div></div>`;

function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalbg').classList.add('open')}
function closeModal(){document.getElementById('modalbg').classList.remove('open')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
render();
</script>
</body>
</html>
